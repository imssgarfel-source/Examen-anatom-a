<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Concluida - Anatomía y Fisiología</title>
    <style>
        body {
            background-color: #f7fafc;
            color: #2d3748;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 500px;
            text-align: center;
            border-top: 5px solid #c53030;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }
        p {
            color: #718096;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .badge {
            background: #fff5f5;
            color: #c53030;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Evaluación Finalizada</h2>
        <p>El periodo oficial de aplicación para este examen parcial ha concluido. Agradecemos su participación y esfuerzo académico.</p>
        <div class="badge">Acceso Cerrado</div>
    </div>
</body>
</html>
